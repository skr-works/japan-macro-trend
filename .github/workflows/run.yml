name: Data Pipeline Execution

on:
  schedule:
    # JST 08:30 (UTC 23:30 previous day) - Mon to Fri (UTC Sun to Thu)
    - cron: '30 23 * * 0-4'
    # JST 15:45 (UTC 06:45) - Mon to Fri
    - cron: '45 6 * * 1-5'
  workflow_dispatch:

jobs:
  process_data:
    runs-on: ubuntu-latest
    # リポジトリへの書き込み権限を追加
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        # コミット履歴を遡れるように fetch-depth: 0 を指定
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Pipeline
      env:
        # 難読化された認証情報を渡す
        DATA_PIPELINE_CREDENTIALS: ${{ secrets.DATA_PIPELINE_CREDENTIALS }}
      run: python main.py

    # 外部アクションを使用せず、シェルスクリプトで60日停止を回避する処理
    - name: Prevent GitHub Actions suspension
      run: |
        last_commit_timestamp=$(git log -1 --format=%ct)
        current_timestamp=$(date +%s)
        diff_days=$(( (current_timestamp - last_commit_timestamp) / 86400 ))
        
        if [ "$diff_days" -ge 50 ]; then
          echo "最終コミットから ${diff_days} 日経過しています。停止回避のための空コミットを作成します。"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: prevent GitHub Actions suspension"
          git push
        else
          echo "最終コミットから ${diff_days} 日経過しています。空コミットは不要です。"
        fi
